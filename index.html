<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Canteen</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a24; --muted:#6b756f; --line:#e4e0d4;
  --brand:#2f7d4f; --brand-d:#225c3a; --accent:#e9a23b; --danger:#c0392b; --ok:#2f7d4f; --warn:#b7791f;
  --radius:14px; --shadow:0 2px 10px rgba(30,40,30,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.15rem;color:var(--brand-d);display:flex;gap:8px;align-items:center}
.spacer{flex:1}
.seg{display:inline-flex;background:#eee9da;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.badge{font-size:.75rem;padding:4px 10px;border-radius:999px;background:#fdf3dc;color:var(--warn);border:1px solid #f1deae;cursor:pointer}
.badge.live{background:#e3f3e9;color:var(--ok);border-color:#bfe0cb}
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
h2{margin:6px 0 12px;font-size:1.3rem}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff;font-weight:600}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand-d);border:1px solid var(--line)}
.btn.warn{background:var(--accent);color:#3a2a05}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar input[type=date],.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.toolbar input[type=search]{flex:1;min-width:180px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;color:var(--ink)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dish{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.dish .pic{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:2.8rem;background:linear-gradient(135deg,#eef5ec,#f7efd9);overflow:hidden}
.dish .pic img{width:100%;height:100%;object-fit:cover;display:block}
.dish .body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.dish .name{font-weight:700}
.dish .meta{font-size:.82rem;color:var(--muted)}
.dish .desc{font-size:.8rem;color:var(--muted)}
.dish .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.price{font-weight:800;color:var(--brand-d)}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:800}
.qty button.plus{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{font-size:.7rem;border-radius:6px;padding:2px 6px;background:#fdf3dc;color:var(--warn);align-self:flex-start}
.dish.off{opacity:.55}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.ok,.pill.sufficient_stock,.pill.confirmed,.pill.completed{background:#e3f3e9;color:var(--ok)}
.pill.pending,.pill.missing_price,.pill.requiring_recipe{background:#fdf3dc;color:var(--warn)}
.pill.cancelled{background:#f8e0dd;color:var(--danger)}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:25}
.cartbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px}
.overlay{position:fixed;inset:0;background:rgba(20,30,20,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);background:var(--card);height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal{margin:auto;width:min(480px,92%);background:var(--card);border-radius:var(--radius);padding:22px;max-height:90vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.cartline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.note{font-size:.82rem;color:var(--muted)}
.alert{padding:10px 12px;border-radius:10px;background:#fdf3dc;color:#6b4a0a;border:1px solid #f1deae;font-size:.88rem;margin-bottom:10px}
.alert.err{background:#f8e0dd;color:#7a1f15;border-color:#efb8b1}
.alert.okk{background:#e3f3e9;color:#1d5a37;border-color:#bfe0cb}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.88rem}
.bar-row .lbl{width:170px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-o{flex:1;background:#eee9da;border-radius:6px;height:14px;overflow:hidden}
.bar-row .bar-i{height:100%;background:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.4rem}
.kpi span{font-size:.8rem;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.dish .pic{font-size:2rem}.bar-row .lbl{width:110px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">🍽️ Smart Canteen</div>
  <div class="seg" id="roleSeg">
    <button data-role="student" class="on">Ученик</button>
    <button data-role="cook">Повар</button>
  </div>
  <div class="spacer"></div>
  <span class="badge" id="modeBadge" title="Нажмите, чтобы изменить адрес API">…</span>
</div></header>
<main id="app"></main>
<div id="cartbar" class="cartbar hidden"><div class="in">
  <div><b id="cartCount">0</b> поз. · <b id="cartSum">0</b></div>
  <div class="spacer" style="flex:1"></div>
  <button class="btn" id="openCart">Оформить предзаказ</button>
</div></div>
<div id="layer"></div>

/* ============ API ============ */
async function http(path, opts={}){
  const h = {'Content-Type':'application/json', ...(opts.headers||{})};
  if(TOKEN) h.Authorization = 'Bearer '+TOKEN;
  let r;
  try{ r = await fetch(CFG.API+path, {...opts, headers:h}); }
  catch{ const e=new Error('Нет связи с сервером. Проверьте интернет и адрес API.'); e.status=0; throw e; }
  if(!r.ok){
    let m = r.statusText, code='';
    try{
      const j = await r.json(), er = j.error;
      if(er){
        code = er.code||''; m = er.message||m;
        if(Array.isArray(er.details)) m += ': ' + er.details.map(d=>d.message||JSON.stringify(d)).join('; ');
      }else if(j.detail){ m = typeof j.detail==='string'?j.detail:JSON.stringify(j.detail); }
    }catch{}
    if(r.status===401 && TOKEN){
      TOKEN=''; localStorage.removeItem('sc_token'); S.authed=false; m='Сессия истекла — войдите снова.';
      if(S.role==='cook') setTimeout(renderCook,0);
    }
    const e = new Error(m); e.status=r.status; e.code=code; throw e;
  }
  if(r.status===204) return null;
  const j = await r.json();
  return (j && typeof j==='object' && 'data' in j) ? j.data : j;   // все ответы бэкенда: {data, meta}
}
async function detectLive(){
  try{
    const c = new AbortController(); const t=setTimeout(()=>c.abort(),2500);
    const r = await fetch(CFG.API+'/health',{signal:c.signal}); clearTimeout(t);
    LIVE = r.ok;
  }catch{ LIVE=false; }
  const b=$('#modeBadge');
  b.textContent = LIVE ? '● API подключён' : '○ Демо-режим (API недоступен)';
  b.className = 'badge'+(LIVE?' live':'');
}

/* ============ DATA LAYER (live ⇄ demo) ============ */
const Data = {
  async load(){
    if(LIVE){
      try{
        const cats = arr(await http('/api/categories'));
        const menu = arr(await http('/api/menu'));
        const icons = Object.fromEntries(CATS.map(c=>[c.slug,c.icon]));
        S.cats = cats.map(c=>({id:c.id,slug:c.slug,name:c.name,icon:icons[c.slug]||'🍽️'}));
        S.menu = menu.map(d=>({id:d.id,name:d.name,slug:d.slug,description:d.description||'',category_id:(d.category&&d.category.id)||d.category_id,
          sale_price:d.sale_price, serving:fmtServing(d.serving_size,d.serving_unit),
          is_available:d.is_available!==false, is_preorder_only:!!d.is_preorder_only, image_url:d.image_url, is_demo:!!d.is_demo}));
        return;
      }catch(e){ console.warn('live load failed',e); LIVE=false; await detectLive(); }
    }
    S.cats=CATS; S.menu=DEMO_MENU;
  },
  async createOrder(payload){
    if(LIVE){
      return http('/api/orders',{method:'POST',headers:{'Idempotency-Key':payload.key},body:JSON.stringify({
        order_date:payload.date, idempotency_key:payload.key, customer_ref:String(payload.customer||'').slice(0,64)||null,
        items:payload.items.map(i=>({dish_id:i.dish_id,quantity:i.quantity,notes:i.notes||null}))})});
    }
    const orders=ls('sc_orders',[]);
    const ex=orders.find(o=>o.key===payload.key); if(ex) return ex;
    const items=payload.items.map(i=>{const d=S.menu.find(x=>x.id===i.dish_id);return {dish_id:d.id,name:d.name,quantity:i.quantity,unit_sale_price:d.sale_price,line_total:num(d.sale_price)*i.quantity}});
    const o={id:Date.now(),key:payload.key,public_order_number:'SC-'+String(orders.length+1).padStart(4,'0'),order_date:payload.date,status:'confirmed',
      customer:payload.customer,items,total_amount:items.reduce((s,i)=>s+i.line_total,0)};
    orders.push(o); lsSet('sc_orders',orders); return o;
  },
  async orders(date){
    if(LIVE) return arr(await http('/api/orders?limit=500&date='+date));
    return ls('sc_orders',[]).filter(o=>o.order_date===date);
  },
  async setStatus(o, action){   // action: cancel | confirm | complete
    if(LIVE) return http(`/api/orders/${o.id}/${action}`,{method:'PATCH'});
    const all=ls('sc_orders',[]); const x=all.find(a=>a.id===o.id);
    if(x) x.status = {cancel:'cancelled',confirm:'confirmed',complete:'completed'}[action]; lsSet('sc_orders',all);
  },
  async summary(date){
    if(LIVE){
      const r=await http('/api/orders/summary?date='+date); const rows=arr(r.dishes||r.rows||r);
      return rows.map(x=>({name:x.dish_name||x.name||('#'+x.dish_id),portions:x.portions??x.total_portions??x.quantity??0,revenue:x.revenue??x.total_amount}));
    }
    const m={}; (await Data.orders(date)).filter(o=>o.status!=='cancelled').forEach(o=>o.items.forEach(i=>{
      m[i.name]=m[i.name]||{name:i.name,portions:0,revenue:0}; m[i.name].portions+=i.quantity; m[i.name].revenue+=i.line_total}));
    return Object.values(m).sort((a,b)=>b.portions-a.portions);
  },
  async procurement(date){
    if(LIVE) return http('/api/procurement-plan/preview',{method:'POST',body:JSON.stringify({date})});
    // ДЕМО-расчёт (в режиме API это делает бэкенд). Целые г / тыйыны, потолок по упаковке.
    const need={}, warn=[];
    (await Data.summary(date)).forEach(r=>{
      const rec=DEMO_REC[r.name]; if(!rec){ warn.push({dish:r.name,status:'requiring_recipe'}); return; }
      for(const [ing,g] of Object.entries(rec)) need[ing]=(need[ing]||0)+g*r.portions;
    });
    let total=0, unknown=false;
    const items=Object.entries(need).map(([id,g])=>{
      const [name,priceKg,pack,stockKg]=DEMO_ING[id];
      const stock=Math.round(stockKg*1000), packG=Math.round(pack*1000);
      const net=Math.max(0,g-stock), cnt=net? Math.ceil(net/packG):0, buy=cnt*packG;
      const cost = priceKg==null?null:Math.round(buy/1000*priceKg*100)/100;
      if(cost==null) unknown=true; else total+=cost;
      return {ingredient_name:name,unit:'g',required_quantity:g,available_quantity:stock,purchase_quantity:buy,package_size:packG,package_count:cnt,estimated_cost:cost,status:cost==null?'missing_price':'ok'};
    });
    return {plan_date:date,items,total_estimated_cost:total,total_is_complete:!unknown,warnings:warn,is_preview:true,demo:true};
  },
  async saveProduction(p){
    if(LIVE) return http('/api/production',{method:'POST',body:JSON.stringify({...p,idempotency_key:uuid()})});
    const a=ls('sc_prod',[]); a.push(p); lsSet('sc_prod',a);
  },
  async saveWaste(w){
    if(LIVE){ const {estimated_cost,...body}=w; return http('/api/waste',{method:'POST',body:JSON.stringify({...body,idempotency_key:uuid()})}); }
    const a=ls('sc_waste',[]); a.push(w); lsSet('sc_waste',a);
  },
  async analytics(from,to){
    if(LIVE){
      const demo = S.includeDemo ? '&include_demo=true' : '';
      const [p,w]=await Promise.all([http(`/api/analytics/popularity?from=${from}&to=${to}${demo}`),http(`/api/analytics/waste?from=${from}&to=${to}${demo}`)]);
      const notes=[];
      if(p.history&&p.history.message) notes.push(p.history.message);
      else if(p.history&&p.history.insufficient_history) notes.push(`Мало истории (${p.history.history_days} дн. из ${p.history.min_history_days}) — выводы ненадёжны.`);
      if((p.history&&p.history.contains_demo_data)||w.contains_demo_data) notes.push('В расчёт включены демонстрационные данные.');
      if(w.cost_is_complete===false) notes.push('Стоимость отходов неполная: у части ингредиентов нет цены.');
      return {pop:{items:p.dishes||[],notes},
              waste:{total_cost:w.total_waste_cost,waste_percent:w.waste_percent_of_prepared,total_portions:w.total_wasted_portions,items:w.by_dish||[]}};
    }
    const orders=ls('sc_orders',[]).filter(o=>o.order_date>=from&&o.order_date<=to&&o.status!=='cancelled');
    const m={}; orders.forEach(o=>o.items.forEach(i=>{m[i.name]=m[i.name]||{dish_name:i.name,portions_sold:0,revenue:0};m[i.name].portions_sold+=i.quantity;m[i.name].revenue+=i.line_total}));
    const waste=ls('sc_waste',[]).filter(w=>w.waste_date>=from&&w.waste_date<=to);
    const prod=ls('sc_prod',[]).filter(p=>p.production_date>=from&&p.production_date<=to);
    const prepared=prod.reduce((s,p)=>s+num(p.prepared_portions),0), disc=waste.reduce((s,w)=>s+num(w.quantity),0);
    return {pop:{items:Object.values(m).sort((a,b)=>b.portions_sold-a.portions_sold),orders:orders.length,notes:[]},
      waste:{total_cost:waste.reduce((s,w)=>s+num(w.estimated_cost||0),0),total_portions:disc,prepared_portions:prepared,waste_percent:prepared?disc/prepared*100:null,
        items:waste}};
  },
  async login(u,p){
    if(!LIVE){ S.authed=true; return; }
    const r=await http('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
    TOKEN=r.access_token||r.token; localStorage.setItem('sc_token',TOKEN); S.authed=true; S.user=r.username; S.userRole=r.role;
  }
};

        <p>Номер заказа: <b style="font-size:1.4rem">${esc(num_)}</b></p>
        <p class="note">Выдача: ${esc(fmtDate(o.order_date||S.orderDate))}. Назовите номер при получении.</p>
        <p>Сумма: <b>${money(o.total_amount)}</b></p>
        <button class="btn" id="ok">Отлично</button></div></div>`;
      $('#ok').onclick=()=>{l.innerHTML='';drawGrid()};
    }catch(e){ btn.disabled=false; btn.textContent='Подтвердить предзаказ'; $('#err').innerHTML=`<div class="alert err">${esc(e.message)}</div>`; }
  };
}

/* ============ COOK VIEW ============ */
function renderCook(){
  if(!S.authed && (LIVE||true)) return renderLogin();
  $('#app').innerHTML=`
   <h2>Панель повара</h2>
   <div class="tabs">${[['orders','Заказы'],['proc','Закупки'],['prod','Производство и отходы'],['an','Аналитика']].map(([k,n])=>
     `<button class="tab ${S.cookTab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}
     <button class="tab" id="logout">Выйти</button></div>
   <div id="cookBody"></div>`;
  $('#app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.cookTab=b.dataset.t;renderCook()});
  $('#logout').onclick=()=>{S.authed=false;TOKEN='';localStorage.removeItem('sc_token');renderCook()};
  ({orders:cookOrders,proc:cookProc,prod:cookProd,an:cookAnalytics})[S.cookTab]();
}
function renderLogin(){
  $('#app').innerHTML=`<div class="panel" style="max-width:380px;margin:30px auto"><h2>Вход для персонала</h2>
    ${LIVE?'':'<div class="alert">Демо-режим: достаточно нажать «Войти».</div>'}
    <div class="field"><label>Логин</label><input id="u" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input id="p" type="password" autocomplete="current-password"></div>
    <div id="err"></div><button class="btn" id="go">Войти</button></div>`;
  $('#go').onclick=async()=>{try{await Data.login($('#u').value,$('#p').value);renderCook()}catch(e){$('#err').innerHTML=`<div class="alert err">${esc(e.message)}</div>`}};
}
const dateField=(id,val)=>`<input type="date" id="${id}" value="${val}">`;

async function cookOrders(){
  const b=$('#cookBody');
  b.innerHTML=`<div class="toolbar">${dateField('cd',S.cookDate)}
    ${LIVE?'':'<button class="btn warn sm" id="seed">+ Демо-заказы (≈120 порций)</button><button class="btn ghost sm" id="clr">Очистить демо-данные</button>'}</div><div id="ob">Загрузка…</div>`;
  $('#cd').onchange=e=>{S.cookDate=e.target.value;cookOrders()};
  if(!LIVE){
    $('#seed').onclick=()=>{ seedDemoOrders(S.cookDate); cookOrders(); };
    $('#clr').onclick=()=>{['sc_orders','sc_prod','sc_waste'].forEach(k=>localStorage.removeItem(k));cookOrders()};
  }
  try{
    const [sum,orders]=await Promise.all([Data.summary(S.cookDate),Data.orders(S.cookDate)]);
    const tot=sum.reduce((s,r)=>s+num(r.portions),0);
    $('#ob').innerHTML=`<div class="kpis"><div class="kpi"><b>${orders.filter(o=>o.status!=='cancelled').length}</b><span>активных заказов</span></div>
      <div class="kpi"><b>${tot}</b><span>порций на ${esc(fmtDate(S.cookDate))}</span></div></div>
      <div class="panel"><h3 style="margin-top:0">Сколько готовить</h3>${sum.length?`<div class="scroll"><table><tr><th>Блюдо</th><th class="num">Порций</th></tr>${sum.map(r=>`<tr><td>${esc(r.name)}</td><td class="num"><b>${r.portions}</b></td></tr>`).join('')}</table></div>`:'<p class="note">Заказов на эту дату пока нет.</p>'}</div>
      <div class="panel"><h3 style="margin-top:0">Заказы</h3>${orders.length?`<div class="scroll"><table><tr><th>№</th><th>Состав</th><th class="num">Сумма</th><th>Статус</th><th></th></tr>${orders.map((o,i)=>`<tr><td>${esc(o.public_order_number||o.id)}</td>
      <td>${esc((o.items||[]).map(x=>`${x.name||x.dish_name||'#'+x.dish_id} ×${x.quantity}`).join(', '))}</td><td class="num">${money(o.total_amount)}</td>
      <td><span class="pill ${esc(o.status)}">${esc(STATUS_RU[o.status]||o.status)}</span></td>
      <td style="white-space:nowrap">${o.status==='cancelled'||o.status==='completed'?'':
        `${o.status==='pending'?`<button class="btn sm" data-a="confirm" data-c="${i}">Подтвердить</button> `:`<button class="btn sm" data-a="complete" data-c="${i}">Выдан</button> `}<button class="btn danger sm" data-a="cancel" data-c="${i}">Отменить</button>`}</td></tr>`).join('')}</table></div>`:'<p class="note">Нет заказов.</p>'}</div>`;
    $('#ob').querySelectorAll('[data-c]').forEach(x=>x.onclick=async()=>{
      const act=x.dataset.a; if(act==='cancel' && !confirm('Отменить заказ?'))return;
      try{await Data.setStatus(orders[x.dataset.c],act);cookOrders()}catch(e){alert(e.message)} });
  }catch(e){ $('#ob').innerHTML=`<div class="alert err">${esc(e.message)}</div>`; }
}
function seedDemoOrders(date){
  const names=Object.keys(DEMO_REC); const orders=ls('sc_orders',[]); let portions=0, n=orders.length;
  while(portions<120){
    const items=[]; const k=1+Math.floor(Math.random()*3);
    for(let j=0;j<k;j++){ const d=dishByName(names[Math.floor(Math.random()*names.length)]); const q=1+Math.floor(Math.random()*2);
      if(!items.find(i=>i.dish_id===d.id)){items.push({dish_id:d.id,name:d.name,quantity:q,unit_sale_price:d.sale_price,line_total:num(d.sale_price)*q});portions+=q;} }
    n++; orders.push({id:Date.now()+n,key:'seed-'+n+'-'+Date.now(),public_order_number:'SC-'+String(n).padStart(4,'0'),order_date:date,status:'confirmed',customer:'demo',items,total_amount:items.reduce((s,i)=>s+i.line_total,0),is_demo:true});
  }
  lsSet('sc_orders',orders);
}

async function cookProc(){
  const b=$('#cookBody');
  b.innerHTML=`<div class="toolbar">${dateField('pd',S.cookDate)}<button class="btn" id="calc">Рассчитать закупку</button></div>
    ${LIVE?'':'<div class="alert">Демо-режим: считаются только блюда с демо-рецептами (плов, курица с рисом/картофелем, лагман, пюре, рис, салат из капусты, омлет). В режиме API весь расчёт делает бэкенд — фронтенд ничего не пересчитывает.</div>'}
    <div id="pb"><p class="note">Нажмите «Рассчитать». Предварительный расчёт не меняет склад.</p></div>`;
  $('#pd').onchange=e=>S.cookDate=e.target.value;
  $('#calc').onclick=async()=>{
    $('#pb').innerHTML='Считаем…';
    try{
      const r=await Data.procurement($('#pd').value);
      const items=arr(r.items||r.lines);
      const warns=[...arr(r.warnings), ...arr(r.dishes_requiring_recipe).map(d=>({dish:d.dish_name}))];
      const kg=(v,u)=> (u==='g'||!u)?(num(v)/1000).toLocaleString('ru-RU',{maximumFractionDigits:2})+' кг':(u==='ml')?(num(v)/1000).toLocaleString('ru-RU',{maximumFractionDigits:2})+' л':num(v).toLocaleString('ru-RU')+' '+(UNIT_RU[u]||u);
      const complete=r.total_is_complete!==false && !items.some(i=>i.status==='missing_price');
      $('#pb').innerHTML=`${warns.length?`<div class="alert">${warns.map(w=>esc(typeof w==='string'?w:(w.dish?`${w.dish}: нет рецептуры (requiring_recipe), в расчёт не включено`:JSON.stringify(w)))).join('<br>')}</div>`:''}
        ${!complete?'<div class="alert err">У части ингредиентов нет цены (missing_price) — итоговая стоимость неполная.</div>':''}
        ${items.length?`<div class="panel scroll"><table><tr><th>Ингредиент</th><th class="num">Нужно</th><th class="num">На складе</th><th class="num">Закупить</th><th class="num">Упаковок</th><th class="num">Стоимость</th><th>Статус</th></tr>
        ${items.map(i=>{const u=i.unit||'g';return `<tr><td>${esc(i.ingredient_name||i.name||i.ingredient_id)}</td>
          <td class="num">${kg(i.required_quantity,u)}</td><td class="num">${kg(i.available_quantity,u)}</td>
          <td class="num"><b>${kg(i.purchase_quantity,u)}</b></td><td class="num">${i.package_count??'—'}${i.package_size?` × ${kg(i.package_size,u)}`:''}</td>
          <td class="num">${i.estimated_cost==null?'—':money(i.estimated_cost)}</td><td><span class="pill ${esc(i.status||'ok')}">${esc(PSTAT_RU[i.status||'ok']||i.status)}</span></td></tr>`}).join('')}
        <tr><td colspan="5"><b>Итого${complete?'':' (неполное)'}</b></td><td class="num"><b>${money(r.total_estimated_cost)}</b></td><td></td></tr></table></div>`
        :'<p class="note">Закупка не требуется или нет заказов на эту дату.</p>'}
        ${LIVE&&items.length&&complete?'<button class="btn" id="approve">Утвердить план закупки</button> <span class="note">доступно экономисту и администратору</span>':''}`;
      const ap=$('#approve'); if(ap) ap.onclick=async()=>{ try{ ap.disabled=true; const p=await http('/api/procurement-plan',{method:'POST',headers:{'Idempotency-Key':uuid()},body:JSON.stringify({date:$('#pd').value})}); ap.outerHTML=`<div class="alert okk">План утверждён (№ ${esc(p.id||'')}).</div>`; }catch(e){ap.disabled=false;alert(e.message)} };
    }catch(e){ $('#pb').innerHTML=`<div class="alert err">${esc(e.message)}</div>`; }
  };
}

function cookProd(){
  const opts=S.menu.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');
  $('#cookBody').innerHTML=`<div class="row">
   <div class="panel" style="flex:1;min-width:280px"><h3 style="margin-top:0">Итоги производства</h3>
    <div class="field"><label>Блюдо</label><select id="pdish">${opts}</select></div>
    <div class="field"><label>Дата</label>${dateField('pdate',addDays(0))}</div>
    <div class="row"><div class="field"><label>Запланировано</label><input type="number" min="0" id="p1" value="0"></div>
      <div class="field"><label>Приготовлено</label><input type="number" min="0" id="p2" value="0"></div></div>
    <div class="row"><div class="field"><label>Выдано</label><input type="number" min="0" id="p3" value="0"></div>
      <div class="field"><label>Осталось</label><input type="number" min="0" id="p4" value="0"></div></div>
    <div class="field"><label>Выброшено порций</label><input type="number" min="0" id="p5" value="0"></div>
    <div id="pmsg"></div><button class="btn" id="psave">Сохранить</button></div>
   <div class="panel" style="flex:1;min-width:280px"><h3 style="margin-top:0">Списать отход</h3>
    <div class="field"><label>Блюдо</label><select id="wdish">${opts}</select></div>
    <div class="row"><div class="field"><label>Порций</label><input type="number" min="0" step="1" id="wq" value="1"></div>
      ${LIVE?'':'<div class="field"><label>Оценка стоимости (KGS)</label><input type="number" min="0" step="0.01" id="wc" value="0"></div>'}</div>
    <div class="field"><label>Причина</label><select id="wr"><option>Не раскупили</option><option>Испортилось</option><option>Брак при приготовлении</option><option>Другое</option></select></div>
    <div id="wmsg"></div><button class="btn warn" id="wsave">Списать</button></div></div>`;
  const msg=(id,t,ok)=>$(id).innerHTML=`<div class="alert ${ok?'okk':'err'}">${esc(t)}</div>`;
  const nonneg=ids=>ids.every(i=>num($(i).value)>=0);
  $('#psave').onclick=async()=>{
    if(!nonneg(['#p1','#p2','#p3','#p4','#p5'])) return msg('#pmsg','Количество не может быть отрицательным');
    const bt=$('#psave'); if(bt.disabled) return; bt.disabled=true;
    try{ await Data.saveProduction({dish_id:+$('#pdish').value,production_date:$('#pdate').value,planned_portions:+$('#p1').value,prepared_portions:+$('#p2').value,served_portions:+$('#p3').value,leftover_portions:+$('#p4').value,discarded_portions:+$('#p5').value}); msg('#pmsg','Сохранено',true);}catch(e){msg('#pmsg',e.message)} finally{bt.disabled=false} };
  $('#wsave').onclick=async()=>{
    if(!(num($('#wq').value)>0)) return msg('#wmsg','Укажите количество больше нуля');
    const bw=$('#wsave'); if(bw.disabled) return; bw.disabled=true;
    try{ await Data.saveWaste({dish_id:+$('#wdish').value,quantity:+$('#wq').value,unit:'portion',reason:$('#wr').value,estimated_cost:$('#wc')?+$('#wc').value:0,waste_date:addDays(0)}); msg('#wmsg','Отход записан',true);}catch(e){msg('#wmsg',e.message)} finally{bw.disabled=false} };
}

async function cookAnalytics(){
  const from=addDays(-30),to=addDays(7);
  $('#cookBody').innerHTML='Загрузка…';
  try{
    const {pop,waste}=await Data.analytics(from,to);
    const demoSw = LIVE ? `<label class="note" style="display:block;margin-bottom:10px"><input type="checkbox" id="incDemo" ${S.includeDemo?'checked':''}> Включить демонстрационные данные (по умолчанию — только реальные)</label>` : '';
    const items=arr(pop.items||pop.dishes||pop); const max=Math.max(1,...items.map(i=>num(i.portions_sold??i.portions)));
    const msgs=(pop.notes||[]).filter(Boolean);
    $('#cookBody').innerHTML=`${demoSw}${msgs.map(m=>`<div class="alert">${esc(m)}</div>`).join('')}
     <div class="kpis"><div class="kpi"><b>${waste.waste_percent==null?'—':num(waste.waste_percent).toFixed(1)+'%'}</b><span>отходов от приготовленного</span></div>
      <div class="kpi"><b>${money(waste.total_cost)}</b><span>стоимость отходов</span></div>
      <div class="kpi"><b>${items.reduce((s,i)=>s+num(i.portions_sold??i.portions),0)}</b><span>порций заказано</span></div></div>
     <div class="panel"><h3 style="margin-top:0">Популярность блюд (${esc(from)} … ${esc(to)})</h3>
      ${items.length?items.slice(0,15).map(i=>{const p=num(i.portions_sold??i.portions);return `<div class="bar-row"><div class="lbl" title="${esc(i.dish_name||i.name)}">${esc(i.dish_name||i.name)}</div><div class="bar-o"><div class="bar-i" style="width:${p/max*100}%"></div></div><b>${p}</b></div>`}).join(''):'<p class="note">Недостаточно истории для надёжных выводов.</p>'}
     </div>`;
    const cb=$('#incDemo'); if(cb) cb.onchange=()=>{S.includeDemo=cb.checked;cookAnalytics()};
  }catch(e){ $('#cookBody').innerHTML=`<div class="alert err">${esc(e.message)}</div>`; }
}

/* ============ ROUTER / INIT ============ */
function render(){
  $('#roleSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));
  S.role==='student'?renderStudent():renderCook();
  updateCartBar();
}
$('#roleSeg').onclick=e=>{const r=e.target.dataset.role; if(r){S.role=r;render()}};
$('#openCart').onclick=openCart;
$('#modeBadge').onclick=async()=>{
  const v=prompt('Адрес backend API (например http://localhost:8000):',CFG.API);
  if(v){ localStorage.setItem('sc_api',v.replace(/\/$/,'')); await boot(); }
};
async function boot(){ await detectLive(); await Data.load(); render(); }
boot();
</script>
